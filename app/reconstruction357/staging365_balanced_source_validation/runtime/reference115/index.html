<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مولد آزمایشی پارامتری</title><style>body{font:18px sans-serif;max-width:1100px;margin:2em auto;padding:0 1em}input,button{font:inherit;margin:.25em}input{width:7em}iframe{width:100%;height:1200px;border:1px solid #ddd}pre{white-space:pre-wrap;overflow-wrap:anywhere}.choice{border:1px solid #bbb;padding:.6em;margin:.5em 0}</style><h1>مولد آزمایشی پارامتری</h1><p>ابعاد ورودی۵تا۴۵متر است؛ پذیرش ورودی به معنی تضمین وجود پلان نیست. جستجو محدود است و «یافت نشد» یا «مهلت تمام شد» به معنی اثبات ناممکن‌بودن نیست. فقط گزینه‌های دارای شاهد بررسی نمایش و صادر می‌شوند. نورگیری، تهویه و کیفیت تأییدنشده جدا اعلام می‌شوند.</p><label>عرض<input id="W" value="۱۰"></label><label>طول<input id="L" value="۱۸"></label><label>تعداد واحد<input id="n" value="۲"></label><label>خواب هر واحد، اختیاری<input id="bed" placeholder="پروفایل اعلام‌شده"></label><button id="go">تولید و بررسی</button><button id="re" disabled>بازگشایی</button><pre id="msg"></pre><details><summary>برنامه، زمان و علت ردها</summary><pre id="evidence"></pre></details><section id="choices"></section><iframe id="plan" title="پیش‌نویس بررسی‌شده"></iframe><script>
const $=id=>document.getElementById(id);let op,result,busy=false;
const statuses={INVALID_INPUT:'ورودی نامعتبر',PROGRAM_UNRESOLVED:'برنامه فضاها هنوز تعیین یا قابل ارزیابی نشده',SEARCH_TIMEOUT_NO_WITNESS:'مهلت جستجو تمام شد؛ پلان بررسی‌شده پیدا نشد',NO_ADMITTED_LAYOUT:'پلان عبورکرده از کنترل‌ها یافت نشد',LIMITED_DRAFT_SET:'پیش‌نویس‌های محدود بررسی‌شده'};
function lock(v){busy=v;for(const id of ['W','L','n','bed','go'])$(id).disabled=v;$('re').disabled=v||!result;document.querySelectorAll('.choice button').forEach(b=>b.disabled=v)}
async function post(path,r){let x=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(r)});if(!x.ok)throw Error('HTTP '+x.status);let p=await x.json();if(p.reason)throw Error(p.reason);return p}
function show(p){result=p;$('choices').replaceChildren();$('msg').textContent=(statuses[p.status]||p.status)+`؛ ${p.distinct_count} گزینه متفاوت، کمبود تا۶: ${p.shortfall}.`;$('evidence').textContent=JSON.stringify({input_exact:p.input_exact,program:p.program_assumptions,search:p.search_evidence,rejections:p.rejections},null,2);p.candidates.forEach((c,i)=>{let box=document.createElement('div');box.className='choice';let label=document.createElement('p');label.textContent=`گزینه ${i+1}: `+(c.label||'پیش‌نویس محدود؛ تأیید نهایی نیست');box.append(label);for(const [name,type,view]of [['نمایش','svg',true],['دانلود SVG','svg',false],['دانلود DXF','dxf',false]]){let b=document.createElement('button');b.textContent=name;b.onclick=()=>artifact(c.candidate_id,type,view);box.append(b)}$('choices').append(box)})}
async function artifact(id,type,view){if(busy)return;lock(true);$('msg').textContent='در حال بازسنجی گزینه و تهیه فایل…';try{let p=await post('/hybrid115-artifact',{operation_id:op,payload_hash:result.payload_hash,candidate_id:id,artifact_type:type});let a=p.artifact;if(view)$('plan').srcdoc='<style>html,body{margin:0}svg{display:block;width:100%;height:auto}</style>'+new TextDecoder().decode(Uint8Array.from(atob(a.base64),c=>c.charCodeAt(0)));else{let link=document.createElement('a');link.href='data:'+a.mime+';base64,'+a.base64;link.download=a.name;link.click()}$('msg').textContent='فایل همین گزینه آماده شد؛ محدودیت‌ها همچنان برقرارند.'}catch(e){$('msg').textContent='صادرات تأیید نشد: '+e.message;$('plan').srcdoc=''}finally{lock(false)}}
async function generate(reopen){if(busy)return;lock(true);$('plan').srcdoc='';$('msg').textContent='در حال تولید مقید و بررسی مستقل…';try{let raw;if(reopen)raw={operation_id:op};else{op=crypto.randomUUID().replaceAll('-','');raw={operation_id:op,W:$('W').value,L:$('L').value,n:$('n').value,requested_count:6};if($('bed').value.trim())raw.program={bedrooms_per_unit:$('bed').value.trim()}}let p=await post(reopen?'/reopen-hybrid115':'/generate-hybrid115',raw);show(p.result)}catch(e){result=null;$('choices').replaceChildren();$('msg').textContent='نتیجه موفق اعلام نمی‌شود: '+e.message}finally{lock(false)}}
$('go').onclick=()=>generate(false);$('re').onclick=()=>generate(true);for(const id of ['W','L','n','bed'])$(id).oninput=()=>{result=null;op=null;$('choices').replaceChildren();$('plan').srcdoc='';$('evidence').textContent='';$('msg').textContent='ورودی تغییر کرد؛ تولید تازه لازم است.';lock(false)};
</script></html>
