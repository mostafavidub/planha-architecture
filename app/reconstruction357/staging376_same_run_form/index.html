<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><title>آزمون کنترل‌شده مسیر تعمیر</title><h1>TEST_ONLY: آزمون کنترل‌شده، نه تولید طبیعی</h1><p>این اجرا فقط یک شاخه balanced را آزمایش می‌کند؛ درخواست دو گزینه تکمیل نمی‌شود. ساخت و بازبینی‌ها در همین اجرا انجام می‌شوند. کیفیت حل‌نشده به معنی تأیید یا تحویل نیست.</p><form id="form"><label>عرض <input name="W" value="۲۶"></label><label>طول <input name="L" value="۲۸"></label><label>واحد <input name="n" value="۲"></label><label>گزینه درخواستی <input name="requested_count" value="۲"></label><button id="submit">اجرای یک‌باره آزمون کنترل‌شده</button></form><pre id="status">آماده؛ TEST_ONLY</pre><script>
let done=false;document.querySelector('#form').onsubmit=async e=>{e.preventDefault();document.querySelector('#submit').disabled=true;try{let values=Object.fromEntries(new FormData(e.target));let r=await fetch('/api/runs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(values)});let j=await r.json();if(!r.ok)throw new Error(JSON.stringify(j));window.transportRunId=j.transport_run_id;let poll=async()=>{try{let response=await fetch(j.status_url);if(!response.ok)throw new Error('TRANSIENT_STATUS');let x=await response.json();document.querySelector('#status').textContent=JSON.stringify(x,null,2);if(x.state==='RUNNING')setTimeout(poll,500);else{done=true;window.finalResult=x;}}catch(transient){document.querySelector('#status').textContent='در انتظار وضعیت معتبر؛ TEST_ONLY';setTimeout(poll,500);}};poll();}catch(err){document.querySelector('#status').textContent=String(err);window.finalResult={state:'ERROR',reason:String(err)};}};
</script></html>
