name: V25 unchanged guard diagnostic
on:
  push:
    paths:
      - '.github/workflows/v25-guard-diagnostic.yml'
      - 'app/review390_preaudit/source_freeze.json'
      - 'app/review399_e1_5_identity_preaudit/source_freeze.json'
      - 'app/review400_e1_5_schema_preaudit/source_freeze.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unchanged-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run original guard without bypass; missing closure is a failure
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B - <<'PY'
          import sys, hashlib, json, os
          from pathlib import Path
          sys.path.insert(0, str(Path('frontend').resolve()))
          from guard400 import guard, HISTORICAL_FREEZE, PARENT_FREEZE, CURRENT_FREEZE
          wanted={'3c77b90d4bbf425148c1c8482c7127cb07ae9503c54f94271debad7728a7f0f1','1a2994cc77c897519d2c4877099b0bb9c1b7cedc99e42d8cc4b6cd7ccd938519','530cc37c1fa0d2a8be10c3ec09a3b6c3c4a8526245e3d0a2e2e719459dab11e0'}
          found=[]
          for candidate in Path('.').rglob('*'):
              if '.git' in candidate.parts or not candidate.is_file() or candidate.is_symlink():
                  continue
              digest=hashlib.sha256(candidate.read_bytes()).hexdigest()
              if digest in wanted:
                  found.append({'sha256':digest,'path':str(candidate)})
          print('registered_exact_freeze_matches', found, flush=True)
          for path in (HISTORICAL_FREEZE, PARENT_FREEZE, CURRENT_FREEZE):
              print('freeze_exists', path.relative_to(Path.cwd()), path.is_file(), flush=True)
          root=Path.cwd()/'app'
          pins=json.loads(CURRENT_FREEZE.read_text())['files']
          normalized={os.path.normpath(str(Path('app')/name)): digest for name,digest in pins.items()}
          index={}
          for candidate in Path('.').rglob('*'):
              if '.git' in candidate.parts or not candidate.is_file() or candidate.is_symlink():
                  continue
              index.setdefault(hashlib.sha256(candidate.read_bytes()).hexdigest(), []).append(str(candidate))
          missing=[]; mismatched=[]; present=0; reusable=[]
          for name,digest in normalized.items():
              p=Path(name)
              if not p.is_file():
                  missing.append(name)
                  if digest in index: reusable.append({'target':name,'existing':index[digest][0]})
              elif hashlib.sha256(p.read_bytes()).hexdigest()!=digest: mismatched.append(name)
              else: present+=1
          print('closure_audit',json.dumps({'references':len(pins),'normalized_paths':len(normalized),'present_matching':present,'missing':len(missing),'mismatched':len(mismatched),'missing_with_same_bytes_registered_elsewhere':len(reusable),'missing_without_registered_match':len(missing)-len(reusable),'first_missing':missing[:10],'first_mismatched':mismatched[:10],'first_reusable':reusable[:10]}),flush=True)
          print('guard_pin_count', guard('530cc37c1fa0d2a8be10c3ec09a3b6c3c4a8526245e3d0a2e2e719459dab11e0'))
          PY
