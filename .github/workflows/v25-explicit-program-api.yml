name: V25 explicit programme API integration
on:
  push:
    paths:
      - '.github/workflows/v25-explicit-program-api.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  explicit-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1
      - name: Contract negatives and actual programme-specific dispatch
        working-directory: app/local_integration
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B -m unittest -v test_explicit_pair_review test_parametric_contract
          timeout 600s python -B - <<'PY'
          import json
          from pathlib import Path
          from generation_gateway import generate
          from run_history import summary,output_gate
          from repair_saved_run import repair
          checks=[];results=[]
          base={'W':'15','L':'25','n':2,'requested_count':1}
          for program in [None,{'bedrooms_per_unit':3},{'bedrooms_per_unit':2}]:
              raw=dict(base)
              if program is not None:raw['program']=program
              status,result=generate(json.dumps(raw).encode());assert status==200,(status,result)
              results.append(result)
              if program!={'bedrooms_per_unit':2}:
                  assert result['generated_count']==0 and result['program_policy']['bedrooms_per_unit']==3
              else:
                  assert result['generated_count']==1 and result['program_policy']['bedrooms_per_unit']==2 and result['program_policy']['fallback_from_three_bedrooms'] is False
                  c=result['candidates'][0];assert c['generation_context']['construction_trace']['schema']=='CONSTRUCTION_TRACE127_PAIR_V1'
                  assert c['physical_review']['multiproposal_provenance127']['verified'] is True
                  assert c['functional_review']['display_allowed'] is False and c['accepted'] is False and c['qualified'] is False
                  assert result['envelope']['received_input']==raw and c['model']['inputs']==['15','25',2]
                  history=summary(result['run_id']);assert history['live_model_restored'] is False
                  denied,payload=output_gate(result['run_id']);assert denied==403 and payload['artifact_bytes_sent']==0
                  denied,payload=repair(json.dumps({'run_id':result['run_id'],'candidate_id':c['candidate_id']}).encode())
                  assert denied==422 and payload['code']=='VERIFIED_NATURAL_REJECTION_REQUIRED'
              assert result['qualified_count']==0 and result['delivery_allowed'] is False
          checks.append('default_and_explicit3_do_not_fallback_to2; explicit2_generated_bound_pair_model')
          for updates in [{'W':'25.000000000000000001'},{'n':1},{'program':{'bedrooms_per_unit':1}},{'program':{'bedrooms_per_unit':2,'capacity':4}}]:
              raw={**base,'program':{'bedrooms_per_unit':2},**updates};status,result=generate(json.dumps(raw).encode())
              assert status in (409,422) and result['accepted'] is False and 'run_id' not in result
          checks.append('range_unit_and_unsupported_program_rejected_before_worker')
          report={'checks':checks,'qualified':0,'accepted':False,'delivery_allowed':False,'results':results}
          Path('explicit-program-api.json').write_text(json.dumps(report,ensure_ascii=False))
          print('EXPLICIT_PROGRAM_API '+json.dumps({'checks':checks,'runs':[r['run_id'] for r in results],'generated':[r['generated_count'] for r in results],'qualified':0,'accepted':False}),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v25-explicit-program-api
          path: |
            app/local_integration/explicit-program-api.json
            app/local_integration/evidence/requests
          retention-days: 30
