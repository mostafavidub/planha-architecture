name: P17 single unit actual API
on:
  push:
    branches: [main]
    paths:
      - 'app/local_integration/single_*_p17.py'
      - 'app/local_integration/public_program_dispatch_p17.py'
      - 'studies/*p17*'
      - 'tests/r4/test_current_entry_launch_x03.py'
      - '.github/workflows/p17-single-api.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  single-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: app/local_integration:app/reconstruction357/planha_general150_runtime_work:tests/r4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1
      - run: python -B studies/test_p15_single_model.py
      - run: python -B studies/test_single_physical_p17.py
      - run: python -B studies/test_single_evaluation_p17.py
      - run: python -B studies/test_public_single_p17.py
      - run: python -B -m unittest test_public_wln_contract test_current_entry_launch_x03 -v
      - name: One actual HTTP n1 attempt with full temporary reports
        if: contains(github.event.head_commit.message, '[p17-live]')
        run: python -B studies/p17_http_single.py
      - run: git diff --exit-code
