name: Current matrix211 independent limited batch
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/local_integration/current_matrix211.py'
      - 'tests/r4/test_current_matrix211.py'
      - '.github/workflows/r4-current-matrix211.yml'
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3
      - name: Synthetic boundary and report binding tests
        run: python -B -m unittest discover -s tests/r4 -p test_current_matrix211.py -v
      - name: Two approved fresh nonpersonal cases and unsupported control
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[matrix211-live]')
        run: python -B app/local_integration/current_matrix211.py
