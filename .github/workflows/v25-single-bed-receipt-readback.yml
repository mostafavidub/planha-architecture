name: V25 read-only single-bed failure receipt
on:
  push:
    paths:
      - '.github/workflows/v25-single-bed-receipt-readback.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: single-bed-wall-extension-task3-5
          run-id: 44473534991
          github-token: ${{ github.token }}
          path: evidence
      - run: |
          python - <<'PY'
          import json,pathlib
          r=json.loads(next(pathlib.Path('evidence').rglob('single-bed-wall-extension.json')).read_text())
          print(json.dumps({k:v for k,v in r.items() if k not in ('probes','original_physical_report','targets','replay')},sort_keys=True))
          PY
