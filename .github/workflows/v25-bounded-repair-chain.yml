name: V25 bounded fresh repair chain task4.3
on:
  push:
    paths:
      - 'app/local_integration/bounded_repair_chain.py'
      - 'app/local_integration/test_bounded_repair_chain.py'
      - '.github/workflows/v25-bounded-repair-chain.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1
      - uses: actions/download-artifact@v4
        with:
          name: live-programme-scheduler-1-3-1-4
          run-id: 44460753648
          github-token: ${{ github.token }}
          path: repair-input/live
      - uses: actions/download-artifact@v4
        with:
          name: rejection-operator-selection-task4-1
          run-id: 44464386479
          github-token: ${{ github.token }}
          path: repair-input/selection
      - uses: actions/download-artifact@v4
        with:
          name: typed-repair-protection-task4-2
          run-id: 44465121269
          github-token: ${{ github.token }}
          path: repair-input/protection
      - name: Strict role-limited transport tests without geometry
        env:
          PYTHONPATH: app/local_integration
        run: python -B -m unittest -v test_bounded_repair_chain test_protected_repair_contract
      - name: One fresh isolated operator and all gates with shared 240 second limit
        env:
          PYTHONPATH: app/local_integration
        run: python -B app/local_integration/bounded_repair_chain.py repair-input
      - name: Read actual resulting evidence without turning UNKNOWN into approval
        if: always()
        env:
          PYTHONPATH: app/local_integration
        run: |
          python -B - <<'PY'
          import pathlib,json
          fs=list(pathlib.Path('repair-evidence').glob('*/repair-complete.json'))
          for f in fs:
           r=json.loads(f.read_text())
           summary={k:r.get(k) for k in ('state','completed','stage','stages','errors','generated_count','generated_count_scope','child_observed','fresh_child_binding_verified','parent_model_digest','child_model_digest','parent_physical_digest','child_physical_status','child_pending_count','current_decision','current_decision_digest','source_integrity_verified','operator_attempts_constructed_models_observed')}
           if 'physical' in r['reports']:
            summary['physical_errors']=r['reports']['physical']['errors'];summary['physical_pending']=r['reports']['physical']['pending']
           print(json.dumps(summary,sort_keys=True))
           assert all(r[k] is False for k in ('accepted','qualified','display_allowed','delivery_allowed'))
          PY
      - run: git diff --exit-code
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-fresh-repair-chain-task4-3
          path: repair-evidence/
          retention-days: 30
