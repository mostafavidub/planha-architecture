name: P27 guest-only repair operator capture
on:
  push:
    branches: [p27-guest-scope-review]
    paths:
      - 'studies/guest_compound_candidate_p27.py'
      - 'tests/r4/test_guest_compound_p27.py'
      - '.github/workflows/p27-guest-matrix.yml'
permissions:
  contents: read
jobs:
  no-solver:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1
      - run: python -B -m unittest discover -s tests/r4 -p test_guest_compound_p27.py -v
