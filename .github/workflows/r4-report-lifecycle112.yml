name: R4 ephemeral report lifecycle checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/local_integration/report_lifecycle112.py'
      - 'tests/r4/test_report_lifecycle112.py'
      - '.github/workflows/r4-report-lifecycle112.yml'
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1
      - run: python -B -m unittest discover -s tests/r4 -p test_report_lifecycle112.py -v
      - run: python -B -m unittest discover -s tests/r4 -p test_request_trace109.py -v
      - run: python -B -m unittest discover -s tests/r4 -p test_request_budget110.py -v
      - run: python -B -m unittest discover -s tests/r4 -p test_current_report_adapter111.py -v
      - run: git diff --exit-code
