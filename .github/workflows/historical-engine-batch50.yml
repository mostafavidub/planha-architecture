name: Historical engine fifty seeded lots diagnostic
on:
  push:
    branches: [main]
    paths:
      - 'studies/historical_engine_batch50.py'
      - '.github/workflows/historical-engine-batch50.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -B studies/historical_engine_batch50.py --self-test
  diagnostic:
    needs: harness
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        batch: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1
      - run: python -B studies/historical_engine_batch50.py --batch ${{ matrix.batch }}
      - run: git diff --exit-code
