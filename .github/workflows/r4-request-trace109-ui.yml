name: R4 request trace UI no generation
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/local_integration/request_trace109.html'
      - 'app/local_integration/request_trace109.js'
      - 'tests/r4/test_request_trace109_browser.py'
      - '.github/workflows/r4-request-trace109-ui.yml'
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1 playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python -B -m unittest discover -s tests/r4 -p test_request_trace109.py -v
      - run: python -B tests/r4/test_request_trace109_browser.py
      - run: git diff --exit-code
