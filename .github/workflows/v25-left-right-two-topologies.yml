name: V25 LEFT_RIGHT source topology comparison
on:
  push:
    paths:
      - 'app/local_integration/compare_left_right_two_topologies.py'
      - '.github/workflows/v25-left-right-two-topologies.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1
      - name: Four preregistered cases with original gates
        run: timeout 780s python -B app/local_integration/compare_left_right_two_topologies.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v25-left-right-two-topology-comparison
          path: topology-comparison.json
          retention-days: 30
