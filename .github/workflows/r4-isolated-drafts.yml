name: R4 isolated historical draft unit checks
on:
  push:
    paths: ['.github/workflows/r4-isolated-drafts.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2899f46cd2b96b1f36985edc52209c252ec886bc
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact isolated draft syntax and contract tests, not current integration
        env:
          PYTHONPATH: app/local_integration
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest discover -s tests/r4 -p test_scope_ledger.py -v
      - name: No tracked mutation
        if: always()
        run: git diff --exit-code
  coverage:
    runs-on: ubuntu-24.04
