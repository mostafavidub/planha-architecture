name: V25 LEFT_RIGHT explicit two diagnostic
on:
  push:
    paths:
      - '.github/workflows/v25-left-right-two.yml'
      - 'app/local_integration/diagnose_left_right_two.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1
      - name: Three preregistered fresh proposals, original replay and inventory
        run: timeout 360s python -B app/local_integration/diagnose_left_right_two.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v25-left-right-two-diagnostic
          path: left-right-two-*.json
          retention-days: 30
