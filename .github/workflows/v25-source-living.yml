name: V25 source living evaluator task3.4
# Historical artifact pipeline is disabled on current source. Original commits remain replayable.
# New data handling authorization and matching source revision are required before re-enabling.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    if: ${{ false }} # HISTORICAL_PIPELINE_NOT_CURRENT_DISPATCH
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1
      - uses: actions/download-artifact@v4
        with:
          name: bounded-original-runtime-task-2-5
          run-id: 44455198301
          github-token: ${{ github.token }}
          path: living-input
      - name: Exact area and route metric tests
        env:
          PYTHONPATH: app/local_integration
        run: python -B -m unittest -v test_source_living_evaluator test_source_guest_route_evaluator
      - name: Same-model living assessment without geometry changes
        env:
          PYTHONPATH: app/local_integration
        run: |
          timeout --kill-after=5s 180s python -B - <<'PY'
          import pathlib,json,hashlib,copy
          from source_living_evaluator import assess
          from same_version_front_rear_contract import digest
          fs=list(pathlib.Path('living-input').rglob('runtime-bundle.json'));assert len(fs)==1
          raw=fs[0].read_bytes();assert hashlib.sha256(raw).hexdigest()=='fb87b9e3de841bb8b81e9bb1812fd14baba75304390c6eeb54cb47b2bcea3720'
          b=json.loads(raw);bad=copy.deepcopy(b);bad['reports']['physical']['model_hash']='0'*64
          bad['report_digests']['physical']=digest(bad['reports']['physical'])
          try:assess(bad)
          except ValueError as ex:assert str(ex)=='PHYSICAL_MODEL_BINDING'
          else:raise AssertionError('wrong model report')
          out=assess(b)
          pathlib.Path('source-living-assessment.json').write_text(json.dumps(out,ensure_ascii=False,sort_keys=True,indent=2))
          print(json.dumps(out,ensure_ascii=False,sort_keys=True))
          assert out['integrity_verified'] is True and not out.get('missing')
          assert out['state']=='UNKNOWN' and len(out['units'])==2
          assert not any(r['state']=='EVALUATOR_ERROR' for u in out['units'] for s in u['studies'] for r in s['routes'])
          assert all(out[k] is False for k in ('accepted','qualified','display_allowed','delivery_allowed'))
          assert digest(out['original_physical_report'])=='676e15defedd8b835215fd9e290c155440d7e2ae8912b8bbf2990653a62ee8a3'
          assert all(u['area_accounting']['verified_useful_living_area_m2'] is None for u in out['units'])
          PY
      - run: git diff --exit-code
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-living-task3-4
          path: source-living-assessment.json
          retention-days: 30
