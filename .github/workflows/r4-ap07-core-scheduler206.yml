name: AP07 two-core shared request study
on:
  workflow_dispatch:
    inputs:
      live:
        type: boolean
        default: false
  push:
    paths:
      - 'app/local_integration/ap07_core_scheduler206.py'
      - 'tests/r4/test_ap07_core_scheduler206.py'
      - '.github/workflows/r4-ap07-core-scheduler206.yml'
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1
      - run: python -B -m unittest discover -s tests/r4 -p test_ap07_core_scheduler206.py -v
      - name: One authorized two-core request; no upload
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.live) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ap07-live]')) }}
        run: python -B app/local_integration/ap07_core_scheduler206.py
      - run: git diff --exit-code
