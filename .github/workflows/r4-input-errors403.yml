name: R4 independent field error diagnostics
on:
  push:
    paths:
      - 'app/local_integration/public_input_errors403.py'
      - 'app/local_integration/public_wln_server.py'
      - 'app/local_integration/request_trace_server109.py'
      - 'app/local_integration/public_wln.js'
      - 'app/local_integration/public_wln.html'
      - 'app/local_integration/request_trace109.js'
      - 'tests/r4/test_public_input_errors403.py'
      - 'tests/r4/run_public_input_errors403_browser.py'
      - '.github/workflows/r4-input-errors403.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  field-errors:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.18'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1 playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - env:
          PYTHONPATH: app/local_integration
        run: |
          python -B -m unittest discover -s tests/r4 -p test_public_input_errors403.py -v
          python -B -m unittest -v test_public_wln_contract test_public_wln_server test_dimension_contract test_v25_input_audit
      - run: node app/local_integration/test_public_wln_domain_v2.js
      - run: python -B tests/r4/run_public_input_errors403_browser.py
      - run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
