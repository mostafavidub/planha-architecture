name: P32-A scoped status browser
on:
  push:
    branches: [main]
    paths:
      - app/local_integration/public_wln.js
      - tests/r4/run_status_p32a.py
      - studies/p32a-status.md
      - .github/workflows/p32a-status.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: app/local_integration:app/reconstruction357/planha_general150_runtime_work
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1 playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: node --check app/local_integration/public_wln.js
      - run: node app/local_integration/test_public_wln_domain_v2.js
      - run: python -B tests/r4/run_status_p32a.py
      - run: git diff --exit-code
