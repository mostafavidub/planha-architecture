name: P20 existing criteria catalog and scoped semantics
on:
  push:
    paths:
      - 'specs/V25_TASK_3_1_CURRENT_FUNCTIONAL_CRITERIA.json'
      - 'studies/p20_catalog_audit.py'
      - 'studies/test_p20_catalog.py'
      - 'studies/p20-condition-inventory.md'
      - '.github/workflows/v25-criteria-catalog.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: studies:app/local_integration:app/reconstruction357/planha_general150_runtime_work
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1
      - name: Current source-linked condition inventory
        run: python -B studies/p20_catalog_audit.py
      - name: Actual primitive and decision tests on synthetic data, no generator
        run: python -B -m unittest discover -s studies -p test_p20_catalog.py -v
      - run: git diff --exit-code
