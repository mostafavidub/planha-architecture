name: V25 isolated source-parameter matrix
on:
  push:
    paths:
      - '.github/workflows/v25-kitchen305-matrix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1
      - name: Fresh independent dimensions and candidate review, no delivery
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          timeout 900s python -B - <<'PY'
          import sys,json,hashlib,time,datetime
          from pathlib import Path
          root=Path.cwd()
          sys.path[:0]=[str(root/'frontend'),str(root/'engine'),str(root/'app/local_integration'),str(root/'app/local_integration/candidate/bundle25')]
          from guard400 import guard
          freeze='530cc37c1fa0d2a8be10c3ec09a3b6c3c4a8526245e3d0a2e2e719459dab11e0'
          assert guard(freeze)==12991
          from constructor129 import frame,build,context
          from evaluate_hierarchical129 import evaluate
          from coarse_kitchen305_candidate import propose
          from parametric_worker import prepare
          from engine114 import revision
          from functional_review import assess
          sources={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in (root/'app/local_integration/candidate/bundle25').glob('*.py')}
          evidence={'test_only':True,'accepted':False,'delivery_allowed':False,'producer_sources':sources,'started_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'rows':[]}
          for W,L in [('25','25'),('24.5','25'),('25','24.5'),('24','24'),('23','25'),('25','23'),('20','25'),('25','20'),('5','5')]:
              for family in ['FRONT_REAR','LEFT_RIGHT']:
                  started=time.monotonic();row={'W':W,'L':L,'family':family}
                  try:
                      _,raw=prepare(json.dumps({'W':W,'L':L,'n':2,'requested_count':1}).encode())
                      core,_=frame(raw,family)
                      if core is None:
                          p={'status':'UNSUPPORTED_CURRENT_CORE_FIT','not_global_infeasibility':True}
                      else:p=propose(core,time_limit=3)
                      row['proposal']=p
                      if p.get('status')=='PROPOSAL_ONLY':
                          packet=build(raw,family,p);ctx=context(raw,p,packet);review=evaluate(packet,ctx)
                          row.update(packet=packet,context=ctx,review=review,functional_review=assess(packet['world_model'],review,revision()))
                  except Exception as error:
                      row['error']=type(error).__name__+':'+str(error)
                      if str(error)=='OUTSIDE_CURRENT_COMMON_INTERFACE_METHOD_NOT_GLOBAL_INFEASIBILITY':row['proposal']={'status':'UNSUPPORTED_CURRENT_CORE_FIT','not_global_infeasibility':True}
                  row['elapsed_seconds']=time.monotonic()-started;evidence['rows'].append(row)
                  print('K305_ROW '+json.dumps({k:v for k,v in row.items() if k not in ['packet','context','proposal','review','functional_review']}|{'proposal_status':row.get('proposal',{}).get('status'),'review_status':row.get('review',{}).get('status'),'errors':row.get('review',{}).get('errors'),'pending':row.get('review',{}).get('pending'),'functional':row.get('functional_review')}),flush=True)
          assert guard(freeze)==12991
          evidence['finished_utc']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          Path('k305-matrix-evidence.json').write_text(json.dumps(evidence,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v25-k305-isolated-matrix
          path: k305-matrix-evidence.json
          retention-days: 30
