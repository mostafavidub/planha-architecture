name: P07 private full-band archival no-solver checks
on:
  push:
    branches:
      - p07-full-band-archive-review
    paths:
      - 'studies/p07_full_band_private.py'
      - 'tests/r4/test_p07_full_band_private.py'
      - '.github/workflows/p07-full-band-archive.yml'
permissions:
  contents: read
jobs:
  source-private-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1
      - run: python -B -m unittest discover -s tests/r4 -p test_p07_full_band_private.py -v
      - run: git diff --exit-code
