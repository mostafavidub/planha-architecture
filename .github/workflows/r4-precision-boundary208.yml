name: R4 precision boundary study
# Upper endpoint uses the same bounded runner; no relaxation or extra criteria run.
on:
  push:
    paths:
      - 'app/local_integration/precision_boundary208.py'
      - 'app/local_integration/precision_pair_study208.py'
      - 'tests/r4/test_precision_boundary208.py'
      - '.github/workflows/r4-precision-boundary208.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1
      - run: python -B -m unittest discover -s tests/r4 -p test_precision_boundary208.py -v
      - if: github.event_name == 'push' && contains(github.event.head_commit.message, '[precision-live]')
        run: python -B app/local_integration/precision_pair_study208.py
      - if: github.event_name == 'push' && contains(github.event.head_commit.message, '[precision-upper]')
        run: python -B app/local_integration/precision_pair_study208.py --upper
      - run: git diff --exit-code
