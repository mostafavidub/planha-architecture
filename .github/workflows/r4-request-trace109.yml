name: R4 request trace study
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/local_integration/request_trace109.py'
      - 'app/local_integration/request_trace_server109.py'
      - 'app/local_integration/cause_directed_chain108.py'
      - 'tests/r4/test_request_trace109.py'
      - 'tests/r4/run_request_trace109.py'
      - '.github/workflows/r4-request-trace109.yml'
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1
      - run: python -B -m unittest discover -s tests/r4 -p test_request_trace109.py -v
      - run: python -B -m unittest discover -s tests/r4 -p test_cause_directed108.py -v
      - if: contains(github.event.head_commit.message, '[trace-live]')
        run: python -B tests/r4/run_request_trace109.py
      - run: git diff --exit-code
