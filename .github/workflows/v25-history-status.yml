name: V25 historical status taxonomy
on:
  push:
    paths:
      - '.github/workflows/v25-history-status.yml'
      - 'app/local_integration/history_status_taxonomy.py'
      - 'app/local_integration/run_history.py'
      - 'app/local_integration/history_ui.js'
      - 'app/local_integration/test_history_status_*.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controlled-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1 playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Unit and actual browser controlled-record regression
        run: |
          timeout 180s python -B - <<'PY'
          import sys,json,unittest,subprocess
          from pathlib import Path
          root=Path.cwd();sys.path[:0]=[str(root/'app/local_integration'),str(root/'engine'),str(root/'frontend')]
          from guard400 import guard
          from explicit_pair_redirection import FREEZE
          from producer_provenance import snapshot,require_unchanged
          paths=['.github/workflows/v25-history-status.yml']+['app/local_integration/'+x for x in ['history_status_taxonomy.py','run_history.py','history_ui.js','test_history_status_taxonomy.py','test_history_status_browser.py','test_run_history.py','test_explicit_pair_review.py','validation_server.py','generation_gateway.py','generation_ui.js']]
          sources=snapshot(root,paths);assert guard(FREEZE)==12991
          subprocess.run(['node','--check','app/local_integration/history_ui.js'],check=True)
          import test_history_status_taxonomy as tests
          import test_run_history, test_explicit_pair_review
          suite=unittest.TestSuite(unittest.defaultTestLoader.loadTestsFromModule(module) for module in (tests,test_run_history,test_explicit_pair_review))
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful()
          from test_history_status_browser import run
          browser=run();assert browser['passed']
          require_unchanged(root,sources);assert guard(FREEZE)==12991
          report={'schema':'V25_HISTORY_STATUS_TEST_V1','controlled_fixture_tests':result.testsRun,'unit_success':True,'browser':browser,'source_snapshot':sources,'guard_before':12991,'guard_after':12991,'accepted':False,'delivery_allowed':False,'scope':'Controlled taxonomy and saved-record/browser regression only. No generated geometry, no new producer outcome, no positive QUALIFIED branch.'}
          Path('history-status.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print('HISTORY_STATUS '+json.dumps(report,ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v25-history-status
          path: |
            history-status.json
            history-status-browser.png
          retention-days: 30
