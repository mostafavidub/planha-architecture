name: R4 1.08 targeted source counterexample regression
on:
  push:
    branches: [main]
    paths:
      - 'app/local_integration/cause_parent_witness108.py'
      - 'app/local_integration/cause_regression_support108.py'
      - 'app/local_integration/cause_regression108.py'
      - 'tests/r4/test_cause_regression108.py'
      - '.github/workflows/r4-cause-regression108.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1
      - run: python -B -m unittest discover -s tests/r4 -p test_cause_regression108.py -v
      - run: python -B -m unittest discover -s tests/r4 -p test_cause_directed108.py -v
      - if: github.event_name == 'push' && contains(github.event.head_commit.message, '[cause-regression-live]')
        run: python -B app/local_integration/cause_regression108.py
      - run: git diff --exit-code
