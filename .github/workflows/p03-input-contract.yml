name: P03 current input contract
on:
  push:
    branches: [main]
    paths:
      - 'studies/test_p03_input_contract.py'
      - 'studies/p03_input_contract.md'
      - '.github/workflows/p03-input-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  input-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: app/local_integration:app/reconstruction357/planha_general150_runtime_work:tests/r4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1
      - name: Actual HTTP and exact contract matrix, no geometry
        run: python -B studies/test_p03_input_contract.py
      - name: Existing contract and registered launcher regressions
        run: python -B -m unittest test_public_wln_contract test_current_entry_launch_x03 -v
      - name: Existing direct boundary checks with execution sentinels
        run: >-
          python -B -m unittest
          test_current_entry_boundary_x03.BoundaryTests.test_all_four_direct_assess_and_decision_enforce_before_transport
          test_current_entry_boundary_x03.BoundaryTests.test_raw_direct_repair_rejects_before_constructor
          test_current_entry_boundary_x03.BoundaryTests.test_valid_producer_real_path_stops_before_milp
          test_current_entry_boundary_x03.BoundaryTests.test_valid_constructor_real_frame_stops_before_assembly -v
      - run: git diff --exit-code
