name: V25 single retained guest contact and clearance task3.3
on:
  push:
    paths:
      - 'app/local_integration/guest_contact_clearance_extension.py'
      - '.github/workflows/v25-guest-contact-clearance.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1
      - uses: actions/download-artifact@v4
        with:
          name: bounded-original-runtime-task-2-5
          run-id: 44455198301
          github-token: ${{ github.token }}
          path: retained-input
      - name: One pinned existing route only, no solver
        env:
          PYTHONPATH: app/local_integration
        run: |
          timeout --kill-after=5s 180s python -B - <<'PY'
          import copy,json,pathlib,hashlib
          from guest_contact_clearance_extension import assess,first_positive_body_contact,fixed_polyline_capacity,contact_order
          raw=next(pathlib.Path('retained-input').rglob('runtime-bundle.json')).read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='fb87b9e3de841bb8b81e9bb1812fd14baba75304390c6eeb54cb47b2bcea3720'
          data=pathlib.Path('manifests/V25_TASK_3_3_SOURCE_GUEST_ROUTES_EVIDENCE.json').read_bytes()
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()=='bf9d458f3901a06cefe8a61881b2ca698ccec129'
          bundle=json.loads(raw);manifest=json.loads(data)
          bad=copy.deepcopy(manifest);bad['model_digest']='0'*64
          try:assess(bundle,bad)
          except ValueError as e:assert str(e)=='MODEL_BINDING'
          else:raise AssertionError('wrong model accepted')
          assert first_positive_body_contact([[0,0],[2,0]],1,[[1,-1,2,1]])=='1/2'
          assert first_positive_body_contact([[2,0],[0,0]],1,[[1,-1,2,1]])=='0'
          try:first_positive_body_contact([[0,0],[0,0]],1,[[1,-1,2,1]])
          except ValueError:pass
          else:raise AssertionError('stationary path accepted')
          try:fixed_polyline_capacity([[0,0],[1,1]],[0,0,3,3],[])
          except ValueError:pass
          else:raise AssertionError('diagonal accepted')
          assert contact_order('1',None) is None and contact_order(None,'1') is None and contact_order('1','1') is False and contact_order('1','2') is True
          out=assess(bundle,manifest)
          pathlib.Path('guest-contact-clearance.json').write_text(json.dumps(out,sort_keys=True,indent=2))
          print(json.dumps({k:v for k,v in out.items() if k!='original_physical_report'},sort_keys=True))
          assert out['integrity_verified'] is True and not out.get('error')
          assert out['state']=='UNKNOWN' and all(out[k] is False for k in ('accepted','qualified','display_allowed','delivery_allowed'))
          PY
      - run: git diff --exit-code
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-guest-contact-clearance-task3-3
          path: guest-contact-clearance.json
          retention-days: 30
