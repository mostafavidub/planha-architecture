name: P06 exact shared-deadline coordinator controls
on:
  push:
    branches: [p06-shared-programme-review]
    paths:
      - 'studies/p06_shared_programme_study.py'
      - 'tests/r4/test_p06_shared_programme.py'
      - '.github/workflows/p06-shared-programme.yml'
permissions:
  contents: read
jobs:
  no-solver:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1
      - run: python -B -m unittest discover -s tests/r4 -p test_p06_shared_programme.py -v
