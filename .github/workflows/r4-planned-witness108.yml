name: R4 1.08 source planned witness repair
on:
  push:
    branches: [main]
    paths:
      - 'app/local_integration/planned_witness_contract108.py'
      - 'app/local_integration/compound_panel_candidate108.py'
      - 'app/local_integration/planned_witness_support108.py'
      - 'app/local_integration/planned_witness_chain108.py'
      - 'tests/r4/test_planned_witness108.py'
      - '.github/workflows/r4-planned-witness108.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1
      - run: python -B -m unittest discover -s tests/r4 -p test_planned_witness108.py -v
      - run: python -B -m unittest discover -s tests/r4 -p test_cause_directed108.py -v
      - if: github.event_name == 'push' && contains(github.event.head_commit.message, '[compound-planned-live]')
        run: python -B app/local_integration/planned_witness_chain108.py
      - run: git diff --exit-code
