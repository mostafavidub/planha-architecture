name: V25 current programme evaluator task3.2
on:
  push:
    paths:
      - 'app/local_integration/current_programme_evaluator.py'
      - 'app/local_integration/test_current_programme_evaluator.py'
      - '.github/workflows/v25-current-programme-evaluator.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1
      - uses: actions/download-artifact@v4
        with:
          name: bounded-original-runtime-task-2-5
          run-id: 44455198301
          github-token: ${{ github.token }}
          path: programme-input
      - name: Source binding helper tests
        env:
          PYTHONPATH: app/local_integration
        run: python -B -m unittest -v test_current_programme_evaluator test_program_profile_registry
      - name: Same original model programme assessment
        env:
          PYTHONPATH: app/local_integration
        run: |
          timeout --kill-after=5s 180s python -B - <<'PY'
          import pathlib,json,hashlib
          from current_programme_evaluator import assess
          files=list(pathlib.Path('programme-input').rglob('runtime-bundle.json'));assert len(files)==1
          raw=files[0].read_bytes();assert hashlib.sha256(raw).hexdigest()=='fb87b9e3de841bb8b81e9bb1812fd14baba75304390c6eeb54cb47b2bcea3720'
          out=assess(json.loads(raw))
          pathlib.Path('programme-assessment.json').write_text(json.dumps(out,ensure_ascii=False,sort_keys=True,indent=2))
          print(json.dumps({'state':out['state'],'decision':out['decision'],'findings':out['findings'],'model_digest':out['model_digest'],'report_digests':out['report_digests'],'inventory':out.get('inventory'),'source_capacity_state':out.get('source_capacity_state')},sort_keys=True))
          assert not any(x['kind']=='EVALUATOR_OR_SOURCE_BINDING_ERROR' for x in out['findings'])
          assert out['state']=='UNKNOWN' and all(out[k] is False for k in ('accepted','qualified','display_allowed','delivery_allowed'))
          PY
      - run: git diff --exit-code
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-programme-task3-2
          path: programme-assessment.json
          retention-days: 30
