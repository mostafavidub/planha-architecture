name: R4 request budget controlled checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/local_integration/request_budget110.py'
      - 'tests/r4/test_request_budget110.py'
      - '.github/workflows/r4-request-budget110.yml'
permissions:
  contents: read
jobs:
  budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1
      - run: python -B -m unittest discover -s tests/r4 -p test_request_budget110.py -v
      - run: python -B -m unittest discover -s tests/r4 -p test_request_trace109.py -v
      - run: git diff --exit-code
