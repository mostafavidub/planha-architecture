name: V25 runtime wiring task 2.3
on:
  push:
    paths:
      - 'app/local_integration/front_rear_runtime_adapter.py'
      - 'app/local_integration/test_front_rear_runtime_wiring.py'
      - '.github/workflows/v25-runtime-wiring.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1
      - name: Contract regression tests
        env:
          PYTHONPATH: app/local_integration
        run: |
          set -o pipefail
          python -B -m unittest -v test_front_rear_runtime_wiring test_program_search_order test_automatic_program_search test_same_version_front_rear_contract test_program_profile_registry test_public_wln_contract test_dimension_contract test_v25_input_audit 2>&1 | tee runtime-wiring-tests.txt
      - name: Source API audit without model execution
        env:
          PYTHONPATH: app/local_integration
        run: |
          python -B -c "import json; from front_rear_runtime_adapter import source_audit; print(json.dumps(source_audit(),ensure_ascii=False,indent=2))" > runtime-wiring-source-audit.json
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-wiring-task-2-3
          path: |
            runtime-wiring-tests.txt
            runtime-wiring-source-audit.json
          retention-days: 30
