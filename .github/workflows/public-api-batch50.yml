name: Current public API fifty seeded lots
on:
  push:
    branches: [main]
    paths:
      - 'studies/public_api_batch50.py'
      - '.github/workflows/public-api-batch50.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public50:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1
      - run: python -B studies/public_api_batch50.py
      - run: git diff --exit-code
