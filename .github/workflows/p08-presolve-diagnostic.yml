name: P08 historical presolve diagnostic
on:
  push:
    paths:
      - 'studies/p08_presolve_11x19.py'
      - 'tests/r4/test_p08_presolve_11x19.py'
      - '.github/workflows/p08-presolve-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  presolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1
      - name: Exact limits and frozen builder, solver aliases prohibited
        run: python -B -m unittest discover -s tests/r4 -p test_p08_presolve_11x19.py -v
      - name: Safe case17 summary with no matrix or model payload
        run: python -B studies/p08_presolve_11x19.py
      - run: git diff --exit-code
