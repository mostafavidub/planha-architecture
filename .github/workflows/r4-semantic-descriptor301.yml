name: Source component semantic descriptor 301
on:
  workflow_dispatch:
  push:
    paths:
      - 'studies/r4/semantic_descriptor301.py'
      - 'studies/r4/test_semantic_descriptor301.py'
      - '.github/workflows/r4-semantic-descriptor301.yml'
      - 'studies/r4/actual_descriptor301.py'
      - 'studies/r4/test_actual_descriptor301.py'
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Source-built component tests only
        run: |
          python -B -m unittest discover -s studies/r4 -p test_semantic_descriptor301.py -v
          python -B -m unittest discover -s studies/r4 -p test_actual_descriptor301.py -v
      - name: One approved nonpersonal actual model descriptor
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[descriptor-live]')
        run: |
          python -m pip install numpy==2.2.6 scipy==1.15.3
          python -B studies/r4/actual_descriptor301.py
