name: V25 FRAME125 nonsquare explicit two
on:
  push:
    paths:
      - 'app/local_integration/study_frame125_two_nonsquare.py'
      - '.github/workflows/v25-frame125-two-nonsquare.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nonsquare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1
      - name: Four nonsquare preregistered cases with unchanged original gates
        run: timeout 780s python -B app/local_integration/study_frame125_two_nonsquare.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v25-frame125-two-nonsquare
          path: frame125-two-nonsquare.json
          retention-days: 30
