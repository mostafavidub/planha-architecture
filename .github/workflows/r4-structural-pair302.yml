name: Actual same-brief structural pair302 study
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/local_integration/structural_pair302.py'
      - 'tests/r4/test_structural_pair302.py'
      - '.github/workflows/r4-structural-pair302.yml'
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3
      - name: Source constraint capture and projection tests
        run: python -B -m unittest discover -s tests/r4 -p test_structural_pair302.py -v
      - name: Previous report-binding regression without solver
        run: python -B -m unittest discover -s tests/r4 -p test_current_matrix211.py -v
      - name: Two approved same-brief variants only
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[structural302-live]')
        run: python -B app/local_integration/structural_pair302.py
