name: Scoped contract checks
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independent contract tests only (not generation acceptance)
        working-directory: app/local_integration
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest -v test_dimension_contract test_parametric_contract test_review_cycle test_range25
