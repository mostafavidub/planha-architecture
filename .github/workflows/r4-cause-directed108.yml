name: R4 cause-directed resynthesis study
on:
  push:
    paths:
      - 'app/local_integration/cause_directed_candidate108.py'
      - 'app/local_integration/cause_directed_contract108.py'
      - 'app/local_integration/cause_directed_chain108.py'
      - 'tests/r4/test_cause_directed108.py'
      - '.github/workflows/r4-cause-directed108.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1
      - run: python -B -m unittest discover -s tests/r4 -p test_cause_directed108.py -v
      - if: github.event_name == 'push' && contains(github.event.head_commit.message, '[cause-live]')
        run: python -B app/local_integration/cause_directed_chain108.py
      - run: git diff --exit-code
