name: R4 paired codec environment
on:
  push:
    paths:
      - '.github/workflows/r4-codec-environment402.yml'
      - 'studies/r4/codec_environment402.py'
      - 'studies/r4/test_codec_environment402.py'
      - 'studies/r4/codec_environment402.lock.json'
      - 'studies/r4/codec_environment402.requirements.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.18'
      - name: Download hash-locked official wheels into a fresh directory
        run: |
          export WHEEL_DIR=$(mktemp -d)
          echo "WHEEL_DIR=$WHEEL_DIR" >> "$GITHUB_ENV"
          python -m pip download --index-url https://pypi.org/simple --only-binary=:all: --no-deps --require-hashes -r studies/r4/codec_environment402.requirements.txt --dest "$WHEEL_DIR"
          python -B studies/r4/codec_environment402.py --wheels "$WHEEL_DIR"
      - name: Create isolated environment and verify actual pip hash rejection
        run: |
          export CODEC_VENV=$(mktemp -d)/venv
          python -m venv "$CODEC_VENV"
          echo "CODEC_VENV=$CODEC_VENV" >> "$GITHUB_ENV"
          "$CODEC_VENV/bin/python" - <<'PY'
          import pathlib,json,os,subprocess,tempfile,sys
          lock=json.loads(pathlib.Path('studies/r4/codec_environment402.lock.json').read_text())
          row=lock['packages'][0]
          with tempfile.TemporaryDirectory() as d:
              req=pathlib.Path(d)/'bad.txt'
              req.write_text(row['name']+'=='+row['version']+' --hash=sha256:'+'0'*64+'\n')
              p=subprocess.run([sys.executable,'-m','pip','install','--dry-run','--no-index','--find-links',os.environ['WHEEL_DIR'],'--no-deps','--require-hashes','-r',str(req)],capture_output=True,text=True)
              assert p.returncode!=0 and 'DO NOT MATCH THE HASHES' in p.stdout+p.stderr
          print('ACTUAL_PIP_HASH_MISMATCH_REJECTED_BEFORE_CODEC')
          PY
      - name: Hash-enforced installation and dependency closure
        run: |
          "$CODEC_VENV/bin/python" -m pip install --no-index --find-links "$WHEEL_DIR" --no-deps --require-hashes -r studies/r4/codec_environment402.requirements.txt
          "$CODEC_VENV/bin/python" -m pip check
      - name: Environment negative controls and paired codec reproduction
        run: |
          "$CODEC_VENV/bin/python" -B -m unittest discover -s studies/r4 -p test_codec_environment402.py -v
          "$CODEC_VENV/bin/python" -B studies/r4/codec_environment402.py
          "$CODEC_VENV/bin/python" -B -m unittest discover -s studies/r4 -p test_paired_codec308.py -v
      - run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
