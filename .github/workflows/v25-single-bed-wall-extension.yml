name: V25 single-bed wall separator extension task3.5
on:
  push:
    paths:
      - 'app/local_integration/single_bed_wall_separator_extension.py'
      - '.github/workflows/v25-single-bed-wall-extension.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  assess:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1
      - uses: actions/download-artifact@v4
        with:
          name: bounded-original-runtime-task-2-5
          run-id: 44455198301
          github-token: ${{ github.token }}
          path: single-bed-input
      - name: Existing actual model and detached binding negatives, no solver
        env:
          PYTHONPATH: app/local_integration
        run: |
          timeout --kill-after=5s 240s python -B - <<'PY'
          import json,pathlib,hashlib,copy
          from single_bed_wall_separator_extension import assess,bind_targets,digest,target_key
          fs=list(pathlib.Path('single-bed-input').rglob('runtime-bundle.json'));assert len(fs)==1
          raw=fs[0].read_bytes();assert hashlib.sha256(raw).hexdigest()=='fb87b9e3de841bb8b81e9bb1812fd14baba75304390c6eeb54cb47b2bcea3720'
          keys={target_key({'unit':'A','fixture_id':'same'}):'openingA',target_key({'unit':'B','fixture_id':'same'}):'openingB'}
          assert len(keys)==2 and keys[('A','same')]=='openingA' and keys[('B','same')]=='openingB'
          b=json.loads(raw);m=b['packet']['world_model'];targets,ids=bind_targets(m)
          assert len(targets)==4 and len(ids)==70
          tested=[]
          for kind in ('geometry','metadata','module_hash','rigid_transform'):
           bad=copy.deepcopy(m);t=targets[0];u=next(u for u in bad['units'] if u['id']==t['unit'])
           if kind=='geometry':u['fixtures'][t['fixture_id']][0]='999'
           elif kind=='metadata':u['fixture_metadata'][t['fixture_id']]['kind']='bed'
           elif kind=='module_hash':bad['module_placements'][0]['module_hash']='0'*64
           else:bad['module_placements'][0]['transform']['matrix']=[[.5,.5],[.5,.5]]
           try:bind_targets(bad)
           except (ValueError,KeyError):tested.append(kind)
           else:raise AssertionError(kind)
          out=assess(b);out['detached_binding_negatives']=tested
          pathlib.Path('single-bed-wall-extension.json').write_text(json.dumps(out,sort_keys=True,indent=2))
          assert out['integrity_verified'] is True and not out.get('error')
          assert out['state']=='UNKNOWN' and out['counts']['single_bed_targets']==4 and out['counts']['separator_pairs']>0
          assert out['original_physical_digest']=='676e15defedd8b835215fd9e290c155440d7e2ae8912b8bbf2990653a62ee8a3'
          assert digest(out['original_physical_report'])==out['original_physical_digest']
          print(json.dumps({k:v for k,v in out.items() if k not in ('probes','original_physical_report')},sort_keys=True))
          PY
      - run: git diff --exit-code
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-bed-wall-extension-task3-5
          path: single-bed-wall-extension.json
          retention-days: 30
