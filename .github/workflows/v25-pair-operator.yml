name: V25 limited explicit pair redirection operator
on:
  push:
    paths:
      - '.github/workflows/v25-pair-operator.yml'
      - 'app/local_integration/explicit_pair_redirection.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1
      - name: Replay real rejected parent and test separate bounded operator
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          timeout 700s python -B - <<'PY'
          import sys,json,tarfile,hashlib,copy
          from pathlib import Path
          root=Path.cwd();sys.path[:0]=[str(root/'app/local_integration'),str(root/'engine'),str(root/'frontend')]
          from explicit_pair_redirection import redirect,require_rejection
          from review_cycle import digest
          index=json.loads((root/'evidence/archive/V25_SELECTED_EVIDENCE_INDEX.json').read_text())
          archive=next(a for a in index['archives'] if a['run_id']==44401790896)
          path=root/'evidence/archive'/archive['path']
          assert hashlib.sha256(path.read_bytes()).hexdigest()==archive['sha256']
          with tarfile.open(path,'r:gz') as tar:
              data=tar.extractfile('explicit-two-bedroom-study.json').read()
          assert hashlib.sha256(data).hexdigest()==archive['members'][0]['sha256']
          source=json.loads(data)
          row=next(r for r in source['rows'] if r['raw']=={'W':'20','L':'20','n':2,'requested_count':1} and r['family']=='FRONT_REAR')
          model=row['packet']['world_model'];ctx=row['context'];mh=digest(model)
          body=json.dumps(dict(row['raw'],program={'bedrooms_per_unit':2})).encode()
          negatives=[]
          for label,review in [('pending_only',dict(row['review'],errors=[],status='UNKNOWN')),('other_error',dict(row['review'],errors=[{'code':'OTHER'}])),('unknown_pending',dict(row['review'],pending=['RULE_NOT_EVALUATED:other']))]:
              try:require_rejection(review)
              except ValueError:negatives.append(label)
              else:raise AssertionError(label)
          for label,b,c in [('missing_explicit_program',json.dumps(row['raw']).encode(),ctx),('different_input',body.replace(b'"20"',b'"21"',1),ctx),('wrong_parent_hash',body,dict(ctx,construction_trace=dict(ctx['construction_trace'],model_hash='0'*64)))]:
              try:redirect(b,model,c)
              except ValueError:negatives.append(label)
              else:raise AssertionError(label)
          result=redirect(body,model,ctx)
          assert digest(model)==mh and result['parent_model_digest']==mh
          assert result['parent_pending_preserved']==row['review']['pending']
          assert result['child'] is not None
          assert result['child']['model_digest']!=mh and result['child']['review']['errors']==[] and result['child']['review']['pending']==[]
          assert all(result[k] is False for k in ['accepted','delivery_allowed','qualified','display_allowed','production_repair_registered'])
          receipt=dict(result);received=receipt.pop('receipt_digest');assert digest(receipt)==received
          Path('explicit-pair-operator.json').write_text(json.dumps({'result':result,'negative_tests':negatives,'archived_parent_replayed_not_new_generation':True}))
          print('PAIR_OPERATOR '+json.dumps({'state':result['state'],'parent':mh,'child':result['child']['model_digest'],'variant':result['child']['variant'],'pending_preserved':result['parent_pending_preserved'],'negative_tests':negatives,'elapsed_seconds':result['elapsed_seconds'],'scope':result['scope'],'accepted':False,'delivery_allowed':False}),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v25-explicit-pair-operator
          path: explicit-pair-operator.json
          retention-days: 30
