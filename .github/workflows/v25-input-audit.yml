name: V25 independent input audit
on:
  push:
    paths:
      - 'app/local_integration/**'
      - '.github/workflows/v25-input-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  input-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate exact input only, not generation
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        working-directory: app/local_integration
        run: python -B -m unittest -v test_v25_input_audit test_v25_active_entrypoints
