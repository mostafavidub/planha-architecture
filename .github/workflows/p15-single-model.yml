name: P15 single unit model
on:
  push:
    branches: [main]
    paths:
      - 'app/local_integration/single_model_p15.py'
      - 'app/local_integration/single_assembler_p15.py'
      - 'app/local_integration/single_access_p15.py'
      - 'studies/p15_single_model.py'
      - 'studies/test_p15_single_model.py'
      - '.github/workflows/p15-single-model.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  single-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: app/local_integration:app/reconstruction357/planha_general150_runtime_work
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1
      - name: Single-unit contract tests
        run: python -B studies/test_p15_single_model.py
      - name: One actual single-unit construction and full temporary evidence
        if: contains(github.event.head_commit.message, '[p15-live]')
        run: python -B studies/p15_single_model.py
      - run: git diff --exit-code
