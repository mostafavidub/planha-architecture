name: HTTP deadline withholding X04 controlled
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app/local_integration/http_withholding_x04.py
      - tests/r4/test_http_withholding_x04.py
      - .github/workflows/r4-http-withholding-x04.yml
permissions:
  contents: read
jobs:
  controlled:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 playwright==1.58.0
      - run: python -B -m unittest discover -s tests/r4 -p test_http_withholding_x04.py -v
      - env:
          PYTHONPATH: app/local_integration
        run: python -B -m unittest -v test_public_wln_server
      - run: python -m playwright install --with-deps chromium
      - run: python -B tests/r4/run_public_navigation310.py
