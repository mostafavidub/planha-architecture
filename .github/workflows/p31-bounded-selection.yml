name: P31 isolated selection mechanics no-solver checks
on:
  push:
    branches: [p31-bounded-selection-review]
    paths:
      - 'studies/p31_bounded_selection.py'
      - 'tests/r4/test_p31_bounded_selection.py'
      - '.github/workflows/p31-bounded-selection.yml'
permissions:
  contents: read
jobs:
  bounded-selection-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s tests/r4 -p test_p31_bounded_selection.py -v
      - run: git diff --exit-code
