name: V25 bounded original runtime task 2.5
on:
  push:
    paths:
      - 'app/local_integration/front_rear_runtime_adapter.py'
      - 'app/local_integration/run_front_rear_bounded_experiment.py'
      - '.github/workflows/v25-bounded-original-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1
      - name: Exact transport and adversarial regression
        env:
          PYTHONPATH: app/local_integration
        run: python -B -m unittest -v test_front_rear_numeric_transport test_front_rear_runtime_adversarial test_front_rear_runtime_wiring
      - name: Original runtime with independent hard kill and wait
        env:
          PYTHONPATH: app/local_integration
        run: python -B app/local_integration/run_front_rear_bounded_experiment.py
      - name: No tracked source changes
        if: always()
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-original-runtime-task-2-5
          path: task-2-5-evidence/
          retention-days: 30
