name: Reviewed source inventory X05
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app/local_integration/current_entry_inventory_x05.py
      - specs/current_entry_inventory_x05.json
      - specs/current_entry_inventory_x05_v2.json
      - tests/r4/test_current_entry_inventory_x05.py
      - .github/workflows/r4-source-inventory-x05.yml
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: app/local_integration:tests/r4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -B -m unittest test_current_entry_inventory_x05.InventoryTests -v
      - run: python -B app/local_integration/current_entry_inventory_x05.py
      - run: git diff --exit-code
  current-http-boundary:
    # Independent: a static scanner failure never skips this behavioral evidence.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: app/local_integration:tests/r4:app/reconstruction357/planha_general150_runtime_work
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1
      - run: python -B -m unittest test_current_entry_inventory_x05.CurrentBoundaryHTTP -v
      - run: git diff --exit-code
